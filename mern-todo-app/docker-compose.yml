services:

  mongodb:
    image: mongo:7
    container_name: mern-mongodb
    restart: unless-stopped
    volumes:
      - mern_mongo_data:/data/db
    networks:
      - mern-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: mern-todo-backend:latest
    container_name: mern-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    env_file:
      - ./backend/.env
    environment:
      PORT: "8001"
      MONGO_URI: mongodb://mongodb:27017/mern_todo
    depends_on:
      - mongodb
    networks:
      - mern-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: mern-todo-frontend:latest
    container_name: mern-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
    networks:
      - mern-network

volumes:
  mern_mongo_data:
    external: true
    name: mern_mongo_data

networks:
  mern-network:
    external: true
    name: mern-network