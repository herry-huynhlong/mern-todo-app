---
- name: Create EC2
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ansible_python_interpreter: "{{ playbook_dir }}/.venv/bin/python"

  tasks:
    - name: Create EC2 instance
      amazon.aws.ec2_instance:
        name: mern-todo-server
        region: ap-southeast-1
        instance_type: t3.small
        image_id: ami-0cefdb30905dbeb73
        key_name: ct
        network_interfaces:
          - assign_public_ip: true
        state: running
        wait: true
      register: ec2

    - name: Show EC2 Public IP
      ansible.builtin.debug:
        msg: "EC2 Public IP: {{ ec2.instances[0].public_ip_address }}"
